<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Profit — Анализ по номенклатурам</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #F4F6FB;
      --bg-card: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --border: #E6EAF2;
      --text-primary: #0E1A2E;
      --text-secondary: #6B7A99;
      --accent: #4F6EF7;
      --accent-hover: #3A55D4;
      --accent-soft: rgba(79,110,247,0.10);
      --positive: #12B76A;
      --negative: #F04438;
      --warning: #F79009;
    }
    html.dark {
      --bg-base: #0B1220;
      --bg-card: #131C2E;
      --bg-sidebar: #0F1828;
      --border: #1F2B41;
      --text-primary: #EAF0FA;
      --text-secondary: #8290AE;
      --accent: #58A6FF;
      --accent-hover: #79B8FF;
      --accent-soft: rgba(88,166,255,0.18);
      --positive: #00A678;
      --negative: #D55C46;
      --warning: #D58F00;
    }

    html, body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    *::-webkit-scrollbar { width: 5px; height: 5px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    input, select, textarea, button { font-family: 'Inter', sans-serif; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(-16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    .recharts-tooltip-wrapper { z-index: 100 !important; }

    table.zebra tbody tr:nth-child(even) > td { background-color: color-mix(in srgb, var(--text-secondary) 9%, transparent); }
    table.zebra tbody tr:nth-child(even) > td:first-child { background-color: color-mix(in srgb, var(--text-secondary) 9%, var(--bg-card)); }
    table.zebra tbody tr:hover > td { background-color: color-mix(in srgb, var(--accent) 10%, transparent) !important; }
  </style>

  <template id="__bundler_thumbnail" data-bg-color="#0B1220">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <rect width="800" height="500" fill="#0B1220"/>
      <rect x="60" y="60" width="680" height="44" rx="10" fill="#131C2E"/>
      <rect x="80" y="76" width="220" height="12" rx="3" fill="#58A6FF"/>
      <rect x="60" y="120" width="680" height="56" rx="10" fill="#131C2E"/>
      <g transform="translate(80,136)">
        <rect width="100" height="24" rx="6" fill="#58A6FF" opacity=".6"/>
        <rect x="112" width="100" height="24" rx="6" fill="#1F2B41"/>
        <rect x="224" width="100" height="24" rx="6" fill="#1F2B41"/>
        <rect x="336" width="100" height="24" rx="6" fill="#1F2B41"/>
      </g>
      <rect x="60" y="192" width="680" height="280" rx="10" fill="#131C2E"/>
      <rect x="80" y="208" width="640" height="32" fill="#0B1220"/>
      <g transform="translate(80,250)">
        <rect width="40" height="40" rx="6" fill="#58A6FF"/>
        <rect x="56" width="120" height="10" rx="3" fill="#EAF0FA"/>
        <rect x="56" y="18" width="180" height="8" rx="3" fill="#8290AE"/>
        <rect x="480" width="60" height="12" rx="3" fill="#00A678" opacity=".4"/>
        <rect x="560" width="80" height="12" rx="3" fill="#00A678"/>
      </g>
      <g transform="translate(80,310)">
        <rect width="40" height="40" rx="6" fill="#D55C46"/>
        <rect x="56" width="140" height="10" rx="3" fill="#EAF0FA"/>
        <rect x="56" y="18" width="200" height="8" rx="3" fill="#8290AE"/>
        <rect x="480" width="60" height="12" rx="3" fill="#D55C46" opacity=".4"/>
        <rect x="560" width="80" height="12" rx="3" fill="#D55C46"/>
      </g>
      <g transform="translate(80,370)">
        <rect width="40" height="40" rx="6" fill="#D58F00"/>
        <rect x="56" width="160" height="10" rx="3" fill="#EAF0FA"/>
        <rect x="56" y="18" width="180" height="8" rx="3" fill="#8290AE"/>
        <rect x="480" width="60" height="12" rx="3" fill="#D58F00" opacity=".4"/>
        <rect x="560" width="80" height="12" rx="3" fill="#D58F00"/>
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="layout.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="reports.jsx"></script>
  <script type="text/babel" src="nomenclature.jsx"></script>
  <script type="text/babel" src="pnl.jsx"></script>
  <script type="text/babel" src="directories.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="registers.jsx"></script>
  <script type="text/babel" src="help.jsx"></script>
  <script type="text/babel">
    // Standalone shell — full layout, default route = nomenclature report
    function StandaloneApp() {
      const [page, setPage] = React.useState('reports/nomenclature');

      function renderPage() {
        switch(page) {
          case 'dashboard': return React.createElement(DashboardPage);
          case 'reports/nomenclature':
          case 'reports/nomenclature-pro':
            return React.createElement(NomenclatureReportV2, { paid: page.endsWith('-pro') });
          case 'reports/weekly': return React.createElement(WeeklyReport);
          case 'reports/pnl':
          case 'reports/pnl-pro': return React.createElement(PnLReport);
          case 'directories/nomenclature': return React.createElement(NomenclatureDirectory);
          case 'directories/expense-items': return React.createElement(ExpenseItemsDirectory);
          case 'directories/cost-supply': return React.createElement(CostBySupplyDirectory);
          case 'directories/cost-period': return React.createElement(CostByPeriodDirectory);
          case 'registers/operations': return React.createElement(OperationsRegister);
          case 'settings/profile': return React.createElement(SettingsProfile);
          case 'settings/api': return React.createElement(SettingsAPI);
          case 'settings/norms': return React.createElement(SettingsNorms);
          case 'settings/notifications': return React.createElement(SettingsNotifications);
          default: return React.createElement(NomenclatureReportV2, { paid: false });
        }
      }

      return React.createElement(Layout, { page, setPage }, renderPage());
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      React.createElement(ThemeProvider, null,
        React.createElement(ToastProvider, null,
          React.createElement(StandaloneApp)
        )
      )
    );
  </script>
</body>
</html>
