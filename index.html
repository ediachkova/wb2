  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #F4F6FB;
      --bg-card: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --border: #E6EAF2;
      --text-primary: #0E1A2E;
      --text-secondary: #6B7A99;
      --accent: #4F6EF7;
      --accent-hover: #3A55D4;
      --accent-soft: rgba(79,110,247,0.10);
      --positive: #12B76A;
      --negative: #F04438;
      --warning: #F79009;
      --chart-area: rgba(79,110,247,0.18);
      --chart-area-2: rgba(46,194,126,0.18);
    }

    html.dark {
      --bg-base: #0B1220;
      --bg-card: #131C2E;
      --bg-sidebar: #0F1828;
      --border: #1F2B41;
      --text-primary: #EAF0FA;
      --text-secondary: #8290AE;
      --accent: #58A6FF;
      --accent-hover: #79B8FF;
      --accent-soft: rgba(88,166,255,0.18);
      --positive: #00A678;
      --negative: #D55C46;
      --warning: #D58F00;
      --chart-area: rgba(88,166,255,0.20);
      --chart-area-2: rgba(46,194,126,0.18);
    }

    html, body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    *::-webkit-scrollbar { width: 5px; height: 5px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    input, select, textarea, button { font-family: 'Inter', sans-serif; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-16px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .45; }
    }

    /* Recharts tooltip override */
    .recharts-tooltip-wrapper { z-index: 100 !important; }
  </style>
